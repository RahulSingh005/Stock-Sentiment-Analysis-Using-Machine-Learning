[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocksent"
version = "1.0.0"
description = "Predicting next-day stock moves from company news: finance sentiment model, tuned ML and LSTM models, backtesting and a FastAPI service"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rahul Singh" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "optuna>=3.4",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "pyarrow>=14",
    "huggingface_hub>=0.20",
    "yfinance>=0.2.40",
    "vaderSentiment>=3.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dl = ["torch>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "fastapi>=0.110", "pydantic>=2.0"]

[project.scripts]
stocksent = "stocksent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
